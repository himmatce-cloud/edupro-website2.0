<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EduPro - Student Dashboard (dashboard.html)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff',
              100: '#e5edff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#0f2b5c',
              900: '#00163d'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Strict Content & Anti-Copy Protection */
    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
<script src="edu-auth.js"></script>
</head>

<body class="min-h-full flex flex-col font-sans bg-slate-100 text-slate-800 antialiased" oncontextmenu="return false;">

  <!-- ================= TOP HEADER NAVIGATION ================= -->
  <header class="bg-white border-b border-slate-200 h-16 shrink-0 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-30 shadow-xs">
    <div class="flex items-center gap-6">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-brand-900 text-white flex items-center justify-center font-black text-xl shadow-md group-hover:scale-105 transition-transform">EP</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-xl tracking-tight text-brand-900">EduPro</span>
            <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded bg-brand-50 text-brand-700 border border-brand-200">STUDENT PORTAL</span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium">अखिल भारतीय डिजिटल अध्ययन प्रकोष्ठ</p>
        </div>
      </a>

      <!-- Goal / Stream Indicator Badge -->
      <div class="hidden md:flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>सक्रिय संकाय:</span>
        <span id="currentStreamLabel" class="font-bold text-brand-900">UPSC CSE &amp; SSC CGL</span>
        <button onclick="toggleStreamModal()" class="text-brand-700 hover:text-brand-900 text-[11px] font-bold underline ml-1 cursor-pointer">बदलें</button>
      </div>
    </div>

    <!-- Right Header Actions -->
    <div class="flex items-center gap-4 text-xs font-semibold">
      <nav class="hidden lg:flex items-center gap-4 text-slate-600">
        <a href="index.html" class="hover:text-brand-700">होमपेज</a>
        <a href="test-series.html" class="hover:text-brand-700">टेस्ट सीरीज़</a>
        <a href="pyq-tricks.html" class="hover:text-brand-700">20-Year PYQ</a>
        <a href="gk.html" class="hover:text-brand-700">दैनिक GK</a>
        <a href="print.html" class="hover:text-brand-700">1-क्लिक प्रिंट</a>
        <a href="help.html" class="hover:text-brand-700">सहायता</a>
      </nav>

      <!-- Pass Upgrade Action Button -->
      <a href="payment.html" class="px-3.5 py-2 bg-brand-900 hover:bg-black text-white rounded-xl shadow-xs transition flex items-center gap-1.5 text-xs font-bold">
        <span class="material-symbols-outlined text-sm text-amber-300">workspace_premium</span>
        <span>₹199 All-Access Pass (30 दिन)</span>
      </a>

      <a href="login.html" onclick="EDU.logout();return false;" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg border border-slate-200 transition" title="लॉगआउट">
        <span class="material-symbols-outlined text-base">logout</span>
      </a>
    </div>
  </header>

  <!-- ================= MAIN DASHBOARD BODY ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

    <!-- WELCOME GREETING & ACCOUNT STATUS BANNER -->
    <div class="bg-gradient-to-r from-brand-900 via-brand-800 to-slate-900 text-white p-6 lg:p-8 rounded-3xl shadow-md flex flex-col md:flex-row items-start md:items-center justify-between gap-6 border border-slate-800">
      <div id="dStreamList" class="space-y-2 max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- ================= SCRIPTS & SECURITY ================= -->
  <script>
    function toggleStreamModal() {
      const modal = document.getElementById('streamModal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }



    // Anti-DevTools & Shortcut Block Shield
    document.addEventListener('keydown', e => {
      if (e.keyCode === 123 || 
         (e.ctrlKey && ['c', 'u', 's', 'a'].includes(e.key.toLowerCase())) ||
         (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
<script>
  const STR = [[1,'10th बोर्ड (NCERT)','🎒'],[2,'12th Science (PCB)','🧬'],[3,'12th Science (PCM)','📐'],[4,'12th Arts','📚'],[5,'12th Commerce','💹'],[6,'NEET (UG)','🩺'],[7,'JEE Main & Advanced','⚡'],[8,'B.Tech Civil','🏗️'],[9,'B.Tech CSE','💻'],[10,'B.Tech Mechanical','⚙️'],[11,'B.Tech Electrical','🔌'],[12,'D.Pharma','💊'],[13,'B.Pharma','🧪'],[14,'B.Sc Nursing & GNM','🏥'],[15,'Fire & Industrial Safety','🔥'],[16,'UPSC Civil Services','🛡️'],[17,'State PSC (सामान्य अध्ययन)','🏛️'],[18,'SSC CGL / CHSL','📝'],[19,'RS-CIT','🖥️'],[20,'Tally Prime & GST','🧾']];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let refCode = '', selId = (() => { try { return localStorage.getItem('edupro_dash_stream') || ''; } catch (e) { return ''; } })();

  function paintStreams() {
    const cur = STR.find(s => String(s[0]) === selId);
    $('currentStreamLabel').textContent = cur ? cur[1] : 'चुनें';
    $('dTrialLink').href = 'test-series.html' + (cur ? '?stream=' + cur[0] : '');
    $('dLaunch').innerHTML = STR.map(s => `<a href="test-series.html?stream=${s[0]}" class="p-4 rounded-2xl border ${String(s[0]) === selId ? 'bg-brand-50 border-brand-300' : 'bg-slate-50 border-slate-200'} hover:border-brand-300 transition flex items-center gap-3"><span class="text-xl">${s[2]}</span><span class="text-xs font-bold text-slate-900">${esc(s[1])}</span></a>`).join('');
    $('dStreamList').innerHTML = STR.map(s => `<button onclick="selectStream(${s[0]})" class="w-full text-left p-3 rounded-xl hover:bg-slate-50 border border-slate-200 flex items-center justify-between text-xs font-bold"><span>${s[2]} ${esc(s[1])}</span></button>`).join('');
  }
  function selectStream(id) { selId = String(id); try { localStorage.setItem('edupro_dash_stream', selId); } catch (e) {} paintStreams(); toggleStreamModal(); }
  function copyReferralCode() { if (!refCode) return; navigator.clipboard.writeText(refCode).then(() => alert('✓ रेफरल कोड कॉपी किया गया: ' + refCode)); }

  (async function () {
    paintStreams();
    const u = await EDU.require(); if (!u) return;
    let s = {}; try { s = await (await fetch('/api/result', { credentials: 'same-origin', cache: 'no-store' })).json(); } catch (e) {}
    $('dGreet').textContent = 'नमस्ते, ' + u.name + '!';
    $('dStudentId').textContent = 'विद्यार्थी आईडी: #EDU-' + u.mobile.slice(-4) + (u.paid ? ' • पास सक्रिय' : ' • निःशुल्क खाता');
    const exp = u.expiry ? new Date(u.expiry).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
    $('dSubTitle').textContent = u.paid ? '₹199 पास सक्रिय' : 'निःशुल्क खाता';
    $('dSubNote').textContent = u.paid ? 'वैधता: ' + exp + ' तक' : 'हर टेस्ट के पहले 30 प्रश्न मुफ़्त';
    $('dTrial').textContent = u.paid ? 'पास सक्रिय — सभी 100 प्रश्न खुले हैं' : 'हर टेस्ट के पहले 30 प्रश्न मुफ़्त';
    $('dTrialTag').textContent = u.paid ? 'पास एक्टिव' : 'फ्री ट्रायल';
    if (!s.ok) return;
    $('dStreak').textContent = s.streak + ' दिन' + (s.streak ? ' लगातार' : '');
    $('dMin').textContent = s.todayMin + ' / 60 मिनट';
    $('dMinBar').style.width = Math.min(100, Math.round(s.todayMin / 60 * 100)) + '%';
    $('dMinNote').textContent = s.todayMin >= 60 ? 'आज का लक्ष्य पूरा 🎉' : 'आज का लक्ष्य: 60 मिनट अभ्यास';
    $('dQs').textContent = s.attempted.toLocaleString('en-IN');
    $('dQsNote').textContent = s.tests + ' टेस्ट सबमिट किए';
    if (s.tests) { $('dAcc').textContent = s.accuracy + '% Accuracy'; $('dAccNote').textContent = 'सर्वश्रेष्ठ स्कोर: ' + s.best; }
    refCode = s.refCode; $('dRefCode').textContent = refCode; $('dRefCount').textContent = s.refPaid % 5;
    const msg = encodeURIComponent('EduPro पर टेस्ट सीरीज़ दें। रजिस्टर करते समय कोड डालें: ' + refCode + ' ' + location.origin);
    $('dWa').href = 'https://api.whatsapp.com/send?text=' + msg; $('dWa').target = '_blank';
    $('dTg').href = 'https://t.me/share/url?url=' + encodeURIComponent(location.origin) + '&text=' + encodeURIComponent('EduPro Code: ' + refCode); $('dTg').target = '_blank';
    if (s.recent && s.recent.length) $('dRecent').innerHTML = '<div class="divide-y divide-slate-100">' + s.recent.map(r => `<div class="py-2 flex items-center justify-between gap-2"><span class="font-bold text-slate-800">${esc(r.stream)} • सेट ${r.set}</span><span>${r.correct} सही • ${r.wrong} गलत • स्कोर ${r.score}/${r.max}</span><span class="text-slate-400">${new Date(r.at).toLocaleDateString('en-GB')}</span></div>`).join('') + '</div>';
  })();
</script>
</body>
</html>
