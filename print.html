<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EduPro - A4 प्रश्न-पत्र प्रिंट / PDF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="edu-auth.js"></script>
<style>
  @page { size: A4 portrait; margin: 12mm; }
  #paper { background: #fff; color: #000; max-width: 210mm; margin: 0 auto; padding: 12mm; font-size: 10.5pt; line-height: 1.35; box-shadow: 0 2px 14px rgba(0,0,0,.12); position: relative; }
  .cols { column-count: 2; column-gap: 8mm; column-rule: 1px solid #ccc; }
  .q { break-inside: avoid; margin-bottom: 3.2mm; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; margin-left: 14px; font-size: 9.5pt; }
  .en { color: #333; font-size: 9.5pt; }
  .part-h { border: 1px solid #000; padding: 2mm 3mm; margin: 3mm 0; font-weight: 700; break-after: avoid; }
  .wm { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .wm span { position: absolute; top: 45%; left: 8%; transform: rotate(-30deg); font-size: 30pt; font-weight: 900; color: rgba(0,0,0,.05); white-space: nowrap; }
  .key { page-break-before: always; }
  @media print {
    body { background: #fff !important; }
    .no-print { display: none !important; }
    #paper { box-shadow: none; padding: 0; max-width: none; }
  }
</style></head>
<body class="bg-slate-100 text-slate-800" oncontextmenu="return false">
<div class="no-print">
  <header class="bg-white border-b px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-black text-lg text-slate-900">EduPro <span class="text-xs text-slate-400 font-bold">A4 Print / PDF</span></a>
    <nav class="text-xs font-semibold flex gap-4"><a href="dashboard.html">डैशबोर्ड</a><a href="test-series.html">टेस्ट सीरीज़</a><a href="help.html">सहायता</a></nav>
  </header>
  <div class="max-w-3xl mx-auto p-4 grid gap-3 sm:grid-cols-2">
    <label class="text-xs font-bold">स्ट्रीम<select id="selStream" class="w-full mt-1 rounded-lg border-slate-300 text-sm"></select></label>
    <label class="text-xs font-bold">टेस्ट सेट नंबर (हर सेट के सवाल अलग)<input id="selSet" type="number" min="1" value="1" class="w-full mt-1 rounded-lg border-slate-300 text-sm"/></label>
    <label class="text-xs font-bold">भाग<select id="selPart" class="w-full mt-1 rounded-lg border-slate-300 text-sm"><option value="all">पूरा पेपर (100 प्रश्न)</option><option value="0">भाग 1</option><option value="1">भाग 2</option><option value="2">भाग 3</option><option value="3">भाग 4</option></select></label>
    <div class="text-xs font-semibold space-y-1 pt-4">
      <label class="flex gap-2"><input id="chkBi" type="checkbox" checked/> द्विभाषी (हिंदी + English)</label>
      <label class="flex gap-2"><input id="chkKey" type="checkbox" checked/> अंतिम पेज पर उत्तर-कुंजी व मेमोरी ट्रिक</label>
      <label class="flex gap-2"><input id="chkWm" type="checkbox" checked/> वॉटरमार्क (आपका मोबाइल)</label>
    </div>
    <button id="btnLoad" class="sm:col-span-2 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold">प्रश्न-पत्र तैयार करें</button>
    <button id="btnPrint" class="sm:col-span-2 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hidden" onclick="window.print()">🖨️ A4 PDF प्रिंट / सेव करें</button>
    <p id="msg" class="sm:col-span-2 text-xs font-semibold text-amber-800"></p>
    <p class="sm:col-span-2 text-[11px] text-slate-500">प्रिंट डायलॉग में Destination: "Save as PDF", Paper: A4, Margins: Default चुनें। केवल प्रश्न-पत्र प्रिंट होता है — बटन, मेन्यू और बाकी पेज प्रिंट नहीं होते।</p>
  </div>
</div>
<div id="paper" class="hidden"></div>
<script>
  const L = ['A', 'B', 'C', 'D'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);
  const STREAMS = [[1,'10th बोर्ड (NCERT)'],[2,'12th Board Science (PCB)'],[3,'12th Board Science (PCM)'],[4,'12th Board Arts'],[5,'12th Board Commerce'],[6,'NEET (UG)'],[7,'JEE Main & Advanced'],[8,'B.Tech Civil'],[9,'B.Tech CSE'],[10,'B.Tech Mechanical'],[11,'B.Tech Electrical'],[12,'D.Pharma'],[13,'B.Pharma'],[14,'B.Sc Nursing & GNM'],[15,'Fire & Industrial Safety'],[16,'UPSC Civil Services'],[17,'State PSC (सामान्य अध्ययन)'],[18,'SSC CGL / CHSL'],[19,'RS-CIT'],[20,'Tally Prime & GST']];
  $('selStream').innerHTML = STREAMS.map(s => `<option value="${s[0]}">${s[0]}. ${esc(s[1])}</option>`).join('');
  const qs = new URLSearchParams(location.search);
  if (qs.get('stream')) $('selStream').value = qs.get('stream');
  const setKey = () => 'edupro_set_' + $('selStream').value;
  const syncSet = () => { try { $('selSet').value = qs.get('set') || localStorage.getItem(setKey()) || 1; } catch (e) {} };
  $('selStream').onchange = syncSet; syncSet();

  async function build() {
    $('msg').textContent = '⏳ प्रश्न लोड हो रहे हैं…'; $('btnPrint').classList.add('hidden'); $('paper').classList.add('hidden');
    const id = $('selStream').value, set = Math.max(1, parseInt($('selSet').value, 10) || 1);
    let d; try { d = await (await fetch(`/api/questions?stream=${id}&set=${set}`, { credentials: 'same-origin', cache: 'no-store' })).json(); } catch (e) { d = null; }
    if (!d || !d.ready) { $('msg').textContent = '⏳ इस स्ट्रीम के प्रश्न अभी तैयार हो रहे हैं। कुछ देर बाद फिर कोशिश करें।'; return; }
    const user = await EDU.ready, name = STREAMS.find(s => String(s[0]) === id)[1], bi = $('chkBi').checked;
    const only = $('selPart').value, parts = d.parts.map((p, i) => ({ p, i })).filter(x => only === 'all' || String(x.i) === only);
    let locked = 0, body = '', key = '';
    parts.forEach(({ p, i }) => {
      body += `<div class="part-h">भाग ${i + 1}: ${esc(p.subject)} <span style="font-weight:400">— संदर्भ: ${esc(p.book)}</span></div><div class="cols">`;
      key += `<div style="font-weight:700;margin-top:3mm">भाग ${i + 1}: ${esc(p.subject)}</div><div class="cols" style="column-count:4">`;
      p.q.forEach((q, k) => {
        const n = i * 25 + k + 1;
        if (q.locked) { locked++; return; }
        body += `<div class="q"><b>${n}.</b> ${esc(q.hi.q)}${bi ? `<div class="en">${esc(q.en.q)}</div>` : ''}<div class="opts">${q.hi.o.map((o, j) => `<div>(${L[j]}) ${esc(o)}${bi ? `<span class="en"> / ${esc(q.en.o[j])}</span>` : ''}</div>`).join('')}</div></div>`;
        key += `<div class="q" style="font-size:9pt"><b>${n}.</b> ${L[q.a]}${q.tr ? ` <span class="en">— ${esc(q.tr)}</span>` : ''}</div>`;
      });
      body += '</div>'; key += '</div>';
    });
    if (locked && !(user && user.paid)) $('msg').textContent = `ℹ️ ${locked} प्रश्न ₹199 पास सक्रिय होने पर खुलेंगे। अभी केवल मुफ्त प्रश्न प्रिंट होंगे।`; else $('msg').textContent = '';
    $('paper').innerHTML = `${$('chkWm').checked ? `<div class="wm"><span>EduPro • ${esc(user ? user.mobile : 'edupro')} • ${esc(user ? user.mobile : '')}</span></div>` : ''}
      <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:2mm"><div style="font-size:15pt;font-weight:900">EduPro टेस्ट सीरीज़ — ${esc(name)}</div>
      <div style="font-size:9.5pt">सेट ${d.set} • समय: 60 मिनट • सही +4 / गलत −1 • नाम: ${esc(user ? user.name : '__________')}</div></div>
      <div style="font-size:9pt;margin:2mm 0">निर्देश: प्रत्येक प्रश्न का केवल एक विकल्प सही है।</div>${body}
      ${$('chkKey').checked ? `<div class="key"><div style="font-size:13pt;font-weight:800">उत्तर-कुंजी — ${esc(name)} (सेट ${d.set})</div>${key}</div>` : ''}`;
    $('paper').classList.remove('hidden'); $('btnPrint').classList.remove('hidden');
  }
  $('btnLoad').onclick = build;
</script></body></html>
