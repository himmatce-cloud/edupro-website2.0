<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-100"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EduPro - टेस्ट सीरीज़</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="edu-auth.js"></script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 overflow-hidden">
<header class="bg-slate-900 text-white px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
  <div class="flex items-center gap-2">
    <a href="index.html" class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold">EP</a>
    <button onclick="openStreams()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">संवर्ग: <b id="hStream">-</b> • सेट <b id="hSet">1</b> ▾</button>
  </div>
  <div class="flex items-center gap-2 text-xs">
    <select id="lang" class="rounded bg-slate-800 border-slate-700 text-white text-xs py-1">
      <option value="both">हिंदी + English</option><option value="hi">हिंदी</option><option value="en">English</option></select>
    <span id="timer" class="font-mono font-bold text-amber-300 bg-slate-800 px-3 py-1.5 rounded-lg">60:00</span>
    <a id="printLink" href="print.html" class="hidden sm:inline px-2 py-1.5 rounded-lg bg-slate-800">🖨️ प्रिंट</a>
    <a href="dashboard.html" class="hidden sm:inline px-2 py-1.5">डैशबोर्ड</a>
  </div>
</header>

<div id="msg" class="hidden m-4 p-4 rounded-xl bg-amber-50 border border-amber-200 text-sm font-semibold text-amber-900"></div>

<main id="app" class="hidden flex-1 min-h-0 flex flex-col lg:flex-row">
  <section class="flex-1 min-h-0 flex flex-col bg-slate-50">
    <div id="partTabs" class="grid grid-cols-2 md:grid-cols-4 gap-2 p-2 bg-white border-b shrink-0"></div>
    <div class="flex-1 overflow-y-auto p-4 max-w-4xl w-full mx-auto space-y-3">
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <b id="qNum" class="text-sm"></b><span id="qCh" class="px-2 py-0.5 rounded bg-slate-100"></span>
        <span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">+4 / −1</span>
        <span id="qBook" class="text-sky-700"></span>
      </div>
      <div id="qText" class="bg-white rounded-xl p-4 border font-semibold leading-relaxed"></div>
      <div id="opts" class="space-y-2"></div>
    </div>
    <div class="bg-white border-t px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 text-xs font-semibold">
      <div class="flex gap-2">
        <button onclick="go(S.cur-1)" class="px-3 py-2 border rounded-lg">← पिछला</button>
        <button onclick="clearAns()" class="px-3 py-2 rounded-lg text-slate-600">हटाएँ</button>
        <button onclick="toggleRev()" class="px-3 py-2 border border-purple-300 bg-purple-50 text-purple-700 rounded-lg">★ समीक्षा</button>
        <button onclick="$('side').classList.toggle('hidden')" class="lg:hidden px-3 py-2 border rounded-lg">☰ सूची</button>
      </div>
      <button onclick="go(S.cur+1)" class="px-5 py-2 bg-indigo-600 text-white rounded-lg">सहेजें और आगे →</button>
    </div>
  </section>
  <aside id="side" class="hidden lg:flex flex-col lg:w-80 max-h-[45vh] lg:max-h-none bg-white border-l shrink-0">
    <div class="p-3 border-b text-[11px] grid grid-cols-2 gap-1 bg-slate-50">
      <span>🟩 हल (<b id="cA">0</b>)</span><span>🟥 अनुत्तरित (<b id="cU">0</b>)</span>
      <span>🟪 समीक्षा (<b id="cR">0</b>)</span><span>⬜ अदृष्ट (<b id="cN">0</b>)</span>
    </div>
    <div id="omr" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
    <div class="p-3 border-t"><button onclick="submitTest(false)" class="w-full py-2.5 bg-slate-900 text-white rounded-lg font-bold text-xs">परीक्षा सबमिट करें</button></div>
  </aside>
</main>

<!-- stream picker -->
<div id="streamModal" class="hidden fixed inset-0 z-40 bg-slate-950/70 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-5">
    <div class="flex items-end gap-3 mb-3">
      <h2 class="font-bold flex-1">संवर्ग चुनें</h2>
      <label class="text-xs font-bold">सेट नंबर <input id="setIn" type="number" min="1" value="1" class="ml-1 w-20 rounded border-slate-300 text-sm"/></label>
      <button onclick="$('streamModal').classList.add('hidden')" class="text-sm px-2">✕</button>
    </div>
    <div id="streamGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2"></div>
  </div>
</div>

<!-- paywall -->
<div id="payModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center space-y-3 my-auto">
    <div class="text-3xl">🔒</div>
    <h3 class="font-bold">बाकी प्रश्न लॉक हैं</h3>
    <p class="text-xs text-slate-600">सभी प्रश्न खोलने के लिए ₹199 का EduPro पास लें। नीचे QR से भुगतान करके 12 अंकों का UTR डालें; जाँच के बाद पास चालू होगा।</p>
    <img src="my_qr.png" alt="PhonePe QR" class="w-44 h-44 object-contain mx-auto border rounded-xl p-1"/>
    <div class="text-[11px] font-mono text-indigo-700 font-semibold">VPA: 9166603971@ibl</div>
    <input id="utr" inputmode="numeric" maxlength="12" placeholder="12 अंकों का UTR / Ref No." class="w-full rounded-lg border-slate-300 text-sm text-center"/>
    <p id="payMsg" class="text-xs font-semibold"></p>
    <button onclick="sendUtr()" class="w-full py-2.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">UTR जमा करें</button>
    <button onclick="$('payModal').classList.add('hidden')" class="w-full py-2 bg-slate-100 rounded-lg text-xs font-semibold">वापस जाएँ</button>
  </div>
</div>

<script>
const STREAMS=[[1,'10th बोर्ड (NCERT)'],[2,'12th Board Science (PCB)'],[3,'12th Board Science (PCM)'],[4,'12th Board Arts'],[5,'12th Board Commerce'],[6,'NEET (UG)'],[7,'JEE Main & Advanced'],[8,'B.Tech Civil'],[9,'B.Tech CSE'],[10,'B.Tech Mechanical'],[11,'B.Tech Electrical'],[12,'D.Pharma'],[13,'B.Pharma'],[14,'B.Sc Nursing & GNM'],[15,'Fire & Industrial Safety'],[16,'UPSC Civil Services'],[17,'State PSC (सामान्य अध्ययन)'],[18,'SSC CGL / CHSL'],[19,'RS-CIT'],[20,'Tally Prime & GST']];
const L=['A','B','C','D'], DURATION=60*60e3, $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const qs0=new URLSearchParams(location.search);
const S={stream:'1',set:1,parts:[],qs:[],cur:0,ans:{},rev:{},seen:{},paid:false,endAt:0,timer:null,done:false};
const sname=()=>(STREAMS.find(s=>String(s[0])===S.stream)||[0,'-'])[1];
const draftKey=()=>`edupro_draft_${S.stream}_${S.set}`;

function showMsg(t){$('msg').textContent=t;$('msg').classList.remove('hidden');$('app').classList.add('hidden');}

async function load(){
  S.done=false;clearInterval(S.timer);
  $('hStream').textContent=sname();$('hSet').textContent=S.set;
  $('printLink').href=`print.html?stream=${S.stream}&set=${S.set}`;
  showMsg('⏳ प्रश्न लोड हो रहे हैं…');
  let d=null;
  try{d=await (await fetch(`/api/questions?stream=${S.stream}&set=${S.set}`,{credentials:'same-origin',cache:'no-store'})).json();}catch(e){}
  if(!d||!d.ready){showMsg('⏳ इस संवर्ग के प्रश्न अभी तैयार हो रहे हैं। कुछ देर बाद कोशिश करें, या दूसरा संवर्ग चुनें।');return;}
  S.paid=!!d.paid;S.set=d.set;$('hSet').textContent=S.set;
  S.parts=d.parts;S.qs=[];
  d.parts.forEach((p,pi)=>p.q.forEach(q=>S.qs.push(Object.assign({},q,{pi,subject:p.subject,book:p.book}))));
  S.ans={};S.rev={};S.seen={};S.endAt=Date.now()+DURATION;
  try{const dr=JSON.parse(ls.get(draftKey())||'null');if(dr&&dr.endAt>Date.now()){S.ans=dr.ans||{};S.rev=dr.rev||{};S.endAt=dr.endAt;}}catch(e){}
  S.cur=Math.max(0,S.qs.findIndex(q=>!q.locked));
  $('msg').classList.add('hidden');$('app').classList.remove('hidden');
  renderTabs();render();tick();S.timer=setInterval(tick,1000);
}
function saveDraft(){ls.set(draftKey(),JSON.stringify({ans:S.ans,rev:S.rev,endAt:S.endAt}));}

function tick(){
  const r=Math.max(0,S.endAt-Date.now()),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);
  $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('timer').className='font-mono font-bold px-3 py-1.5 rounded-lg bg-slate-800 '+(r<5*60e3?'text-rose-400':'text-amber-300');
  if(r<=0)submitTest(true);
}

function go(i){
  if(i<0||i>=S.qs.length)return;
  if(S.qs[i].locked){$('payModal').classList.remove('hidden');return;}
  S.cur=i;render();
}
function pick(j){const q=S.qs[S.cur];S.ans[q.id]=j;saveDraft();render();}
function clearAns(){delete S.ans[S.qs[S.cur].id];saveDraft();render();}
function toggleRev(){const id=S.qs[S.cur].id;S.rev[id]=!S.rev[id];saveDraft();render();}

function txt(q,lang){return lang==='hi'?esc(q.hi.q):lang==='en'?esc(q.en.q):esc(q.hi.q)+`<div class="text-sm font-normal text-slate-600 mt-1">${esc(q.en.q)}</div>`;}
function otxt(q,j,lang){return lang==='hi'?esc(q.hi.o[j]):lang==='en'?esc(q.en.o[j]):esc(q.hi.o[j])+`<span class="text-xs font-normal text-slate-500"> / ${esc(q.en.o[j])}</span>`;}

function render(){
  const q=S.qs[S.cur],lang=$('lang').value;
  S.seen[q.id]=true;
  $('qNum').textContent=`प्रश्न ${S.cur+1} / ${S.qs.length}`;
  $('qCh').textContent=`भाग ${q.pi+1}: ${q.subject}${q.ch?' • '+q.ch:''}`;
  $('qBook').textContent=q.book?'📖 '+q.book:'';
  $('qText').innerHTML=txt(q,lang);
  $('opts').innerHTML=[0,1,2,3].map(j=>{const on=S.ans[q.id]===j;
    return `<div onclick="pick(${j})" class="flex items-center gap-3 p-3.5 rounded-xl border-2 cursor-pointer ${on?'border-indigo-600 bg-indigo-50':'border-slate-200 bg-white hover:border-indigo-400'}"><span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold border ${on?'bg-indigo-600 text-white':'bg-slate-100'}">${L[j]}</span><span class="text-sm font-semibold flex-1">${otxt(q,j,lang)}</span></div>`;}).join('');
  renderOMR();renderTabs();
}

function renderTabs(){
  $('partTabs').innerHTML=S.parts.map((p,i)=>{
    const list=S.qs.filter(q=>q.pi===i&&!q.locked),done=list.filter(q=>S.ans[q.id]!==undefined).length,on=S.qs[S.cur]&&S.qs[S.cur].pi===i;
    return `<button onclick="go(${S.qs.findIndex(q=>q.pi===i)})" class="text-left px-3 py-2 rounded-lg border text-xs font-bold ${on?'bg-indigo-600 text-white border-indigo-700':'bg-slate-50 border-slate-200'}">भाग ${i+1}: ${esc(p.subject)}<span class="block text-[10px] font-normal opacity-80">${done}/${list.length} हल</span></button>`;}).join('');
}

function renderOMR(){
  let a=0,u=0,r=0,n=0,h='';
  S.parts.forEach((p,pi)=>{
    h+=`<div><div class="text-[11px] font-bold text-slate-500 mb-1">भाग ${pi+1}: ${esc(p.subject)}</div><div class="grid grid-cols-5 gap-1.5">`;
    S.qs.forEach((q,i)=>{if(q.pi!==pi)return;
      let c='bg-slate-100 text-slate-700 border-slate-300';
      if(q.locked)c='bg-slate-200 text-slate-400 border-slate-300';
      else if(S.ans[q.id]!==undefined){c='bg-emerald-500 text-white border-emerald-600';a++;}
      else if(S.rev[q.id]){c='bg-purple-500 text-white border-purple-600';r++;}
      else if(S.seen[q.id]){c='bg-rose-500 text-white border-rose-600';u++;}
      else n++;
      if(S.rev[q.id]&&S.ans[q.id]!==undefined){r++;}
      h+=`<button onclick="go(${i})" class="h-8 rounded-md text-xs border font-bold ${c} ${i===S.cur?'ring-2 ring-indigo-600':''}">${i+1}${q.locked?'🔒':''}</button>`;});
    h+='</div></div>';});
  $('omr').innerHTML=h;$('cA').textContent=a;$('cU').textContent=u;$('cR').textContent=r;$('cN').textContent=n;
}

async function submitTest(auto){
  if(S.done)return;
  const avail=S.qs.filter(q=>!q.locked),answered=avail.filter(q=>S.ans[q.id]!==undefined).length;
  if(!auto&&!confirm(`क्या आप परीक्षा सबमिट करना चाहते हैं?\nहल किए गए प्रश्न: ${answered} / ${avail.length}`))return;
  S.done=true;clearInterval(S.timer);
  let c=0,w=0,s=0;const items=[];
  S.qs.forEach((q,i)=>{if(q.locked)return;
    const a=S.ans[q.id],st=a===undefined?'unattempted':a===q.a?'correct':'incorrect';
    if(st==='correct')c++;else if(st==='incorrect')w++;else s++;
    items.push({num:i+1,question:q.hi.q+'\n'+q.en.q,options:q.hi.o.map((o,j)=>o+' / '+q.en.o[j]),studentAns:a===undefined?null:L[a],correctAns:L[q.a],status:st,trick:q.tr||'',part:`भाग ${q.pi+1}: ${q.subject}`});});
  const secs=Math.min(7200,Math.round((DURATION-Math.max(0,S.endAt-Date.now()))/1000)),score=c*4-w;
  const result={stream:sname(),streamName:sname(),total:avail.length,correct:c,wrong:w,skipped:s,score,max:avail.length*4,accuracy:(c+w)?c/(c+w)*100:0,timeTaken:`${Math.floor(secs/60)}m ${String(secs%60).padStart(2,'0')}s`,items,at:new Date().toISOString(),lockedCount:S.qs.length-avail.length};
  ls.set('edupro_last_result',JSON.stringify(result));
  try{await fetch('/api/result',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({streamId:S.stream,set:S.set,correct:c,wrong:w,skipped:s,score,max:avail.length*4,secs})});}catch(e){}
  ls.del(draftKey());
  if(S.paid)ls.set('edupro_set_'+S.stream,String(S.set+1));
  location.href='test-result.html';
}

async function sendUtr(){
  const utr=$('utr').value.trim(),m=$('payMsg');
  if(!/^\d{12}$/.test(utr)){m.className='text-xs font-semibold text-rose-600';m.textContent='सही 12 अंकों का UTR डालें';return;}
  try{const d=await (await fetch('/api/pay',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({utr})})).json();
    m.className='text-xs font-semibold '+(d.ok?'text-emerald-700':'text-rose-600');
    m.textContent=d.ok?'✅ जमा हो गया। जाँच के बाद पास चालू होगा, फिर यह पेज रिफ्रेश करें।':(d.error||'त्रुटि');
  }catch(e){m.className='text-xs font-semibold text-rose-600';m.textContent='नेटवर्क त्रुटि, दोबारा कोशिश करें';}
}

function openStreams(){
  $('setIn').value=S.set;
  $('streamGrid').innerHTML=STREAMS.map(s=>`<button onclick="chooseStream(${s[0]})" class="text-left p-3 rounded-xl border text-xs font-bold ${String(s[0])===S.stream?'bg-indigo-600 text-white border-indigo-700':'bg-white hover:bg-slate-50'}">${s[0]}. ${esc(s[1])}</button>`).join('');
  $('streamModal').classList.remove('hidden');
}
function chooseStream(id){
  const same=String(id)===S.stream;
  S.stream=String(id);
  S.set=Math.max(1,parseInt($('setIn').value,10)||1);
  if(!same&&parseInt($('setIn').value,10)===S.set&&false)S.set=1;
  ls.set('edupro_stream',S.stream);ls.set('edupro_set_'+S.stream,String(S.set));
  $('streamModal').classList.add('hidden');load();
}

$('lang').onchange=()=>{ls.set('edupro_lang',$('lang').value);if(S.qs.length)render();};
(async()=>{
  const u=await EDU.require();if(!u)return;
  $('lang').value=ls.get('edupro_lang')||'both';
  S.stream=String(qs0.get('stream')||ls.get('edupro_stream')||'1');
  if(!STREAMS.some(s=>String(s[0])===S.stream))S.stream='1';
  S.set=Math.max(1,parseInt(qs0.get('set')||ls.get('edupro_set_'+S.stream)||'1',10)||1);
  load();
})();
</script>
</body></html>
